name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
      - run: npm ci
      - run: npm run format

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
      - run: npm ci
      - name: Install pinned ffmpeg 7.0.2
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          npm install --prefix "$RUNNER_TEMP/ffmpeg" ffmpeg-static@5.3.0
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -s "$RUNNER_TEMP/ffmpeg/node_modules/ffmpeg-static/ffmpeg" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
      - run: ffmpeg -version
      - run: npm run test

  crap:
    name: crap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
      - run: npm ci
      - name: Install pinned ffmpeg 7.0.2
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          npm install --prefix "$RUNNER_TEMP/ffmpeg" ffmpeg-static@5.3.0
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -s "$RUNNER_TEMP/ffmpeg/node_modules/ffmpeg-static/ffmpeg" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
      - run: ffmpeg -version
      - run: npm run crap
