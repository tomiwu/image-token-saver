# Image-token-saver bug-finding eval.
# Set EVALS_IMAGE_DIR to the directory that holds the (uncommitted)
# buggy image and its scaled copies. See evals/README.md.
#
# Run with: npm run eval
# Do not add this to CI or precommit; it needs subscription CLIs.

description: "image bug-finding eval: scales, no-tool baseline, clean image, layouts"

prompts:
  - file://prompt-for-test.cjs

providers:
  - id: file://providers/cli-provider.mjs
    label: claude-code
    config:
      id: claude-code
      cli: claude
  - id: file://providers/cli-provider.mjs
    label: grok-4.7-high
    config:
      id: grok-4.7-high
      cli: agent
      model: grok-4.7-high
  - id: file://providers/cli-provider.mjs
    label: gpt-5.2
    config:
      id: gpt-5.2
      cli: agent
      model: gpt-5.2
  - id: file://providers/cli-provider.mjs
    label: gemini-3.1-pro
    config:
      id: gemini-3.1-pro
      cli: agent
      model: gemini-3.1-pro
  - id: file://providers/cli-provider.mjs
    label: composer-2.5
    config:
      id: composer-2.5
      cli: agent
      model: composer-2.5

evaluateOptions:
  maxConcurrency: 1
  repeat: 1
  cache: false

# Each case repeats EVALS_RUNS times (3 to 5). See lib/plan.mjs.
tests: file://tests.cjs
